[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-terminal"
dynamic = ["version"]
description = "AI-assisted trading terminal for Freedom Broker (Tradernet): rules propose, Claude reviews, a risk gate decides."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "tradernet-sdk>=2.2.0",
  "aiohttp>=3.9",
  "requests>=2.31",
  "feedparser>=6.0",
  "numpy>=1.26",
  "platformdirs>=4.0",
  "keyring>=24",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
build = ["pyinstaller>=6.6", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools]
packages = ["meridian", "meridian.engine"]

[tool.setuptools.dynamic]
version = { attr = "meridian.__version__" }

[tool.setuptools.package-data]
meridian = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
